
# DataSource Config
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/elowen?characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  session:
    timeout: 86400
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: delete_flag # logic delete field
      logic-delete-value: 1 # deleted
      logic-not-delete-value: 0 # not deleted
server:
  servlet:
    context-path: /api
